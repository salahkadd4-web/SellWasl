# Compilation Android sur EAS, lancée à la main (phase 29, docs/ci-cd.md) : onglet Actions →
# « Mobile (EAS) » → « Run workflow ». Secret requis : EXPO_TOKEN (compte Expo → Access tokens).
# La compilation se poursuit sur EAS ; le lien de suivi s'affiche dans le journal.
name: Mobile (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profil EAS : preview (APK de test, staging) ou production (AAB pour le Play Store)'
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  eas-build:
    name: Compilation Android (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9.0.1
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compilation EAS
        working-directory: apps/mobile
        env:
          PROFILE: ${{ inputs.profile }}
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

# Services de développement (architecture §18.1).
# Le stockage objet compatible S3 sera ajouté quand l'API en aura besoin (imports, exports, logos).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sellwasl
      POSTGRES_PASSWORD: sellwasl
      POSTGRES_DB: sellwasl
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellwasl']
      interval: 5s
      retries: 10

volumes:
  postgres-data:

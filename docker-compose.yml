# Services de développement (architecture §18.1).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sellwasl
      POSTGRES_PASSWORD: sellwasl
      POSTGRES_DB: sellwasl
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sellwasl']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sellwasl
      MINIO_ROOT_PASSWORD: sellwasl-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
